<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b00"/>
      <stop offset="50%" stop-color="#2d1502"/>
      <stop offset="100%" stop-color="#0a0500"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="50%" stop-color="#e8a838"/>
      <stop offset="100%" stop-color="#915206"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Decorative background rays -->
  <circle cx="200" cy="125" r="140" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
  
  <text x="200" y="70" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#fbbf24" letter-spacing="4" text-anchor="middle">JKT48 THEATER SETLIST</text>
  
  <text x="200" y="130" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-weight="900" fill="url(#gold)" letter-spacing="2" text-anchor="middle" filter="url(#glow)">PASSION</text>
  <text x="200" y="185" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#gold)" letter-spacing="4" text-anchor="middle" filter="url(#glow)">200%</text>
</svg>
